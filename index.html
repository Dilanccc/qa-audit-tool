<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA AUDIT TOOL</title>
<style>
body{font-family:Arial;margin:0;background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:14px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}
nav button{padding:9px 12px;border-radius:20px;border:1px solid #ccc;background:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:#0f172a;color:#fff}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
label{font-weight:700;font-size:13px;display:block;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.item{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:10px}
.pts{display:flex;gap:6px;margin-top:8px}
.pts button{flex:1;padding:10px;border:1px solid #ccc;background:#f8fafc;border-radius:8px;font-weight:800;cursor:pointer}
.pts button.a{background:#16a34a;color:#fff}
.pts button.b{background:#dc2626;color:#fff}
.pts button.c{background:#64748b;color:#fff}
.score{background:#eff6ff;padding:12px;border-radius:10px;font-weight:800;text-align:center}
.btn{background:#0f172a;color:#fff;border:0;padding:13px;border-radius:10px;width:100%;font-weight:800;cursor:pointer;margin-top:10px}
img.t{width:70px;height:70px;object-fit:cover;border-radius:8px;margin-top:5px}
</style></head><body>
<header><h1>QA AUDIT TOOL - RM to FG</h1><div style="font-size:12px;opacity:.8">LAB - RM - Cutting - Bonding - Production - IE - Machine - Safety - Mold - Management - Quality</div></header>
<nav id="nav"></nav><div class="wrap" id="app"></div>
<script>
var CFG={};
CFG["LAB"]=["Fabric Inspection Report","Fabric GSM Report","Shrinkage Report (Residual / Steam)","Shade Band","Approved Fabric Hanger","Mill Inspection Report","Fabric Test Reports","Trims Inspection Reports","Trims Check Under Metal Detection","Fabric Relaxing Reports"];
CFG["RM"]=["Customer wise Fabric store","Fabric storing in Pyramid way","Fabric bin location match with system location","Fabric rolls cover perfectly","Trims bin location match with system location","Label / packing items store in lockable area","FIFO System practicing","Scale are calibrated"];
CFG["Cutting"]=["Plotter calibration","Spreading check report","Cutting In line report","Marker mention relevant details","Auto cutter calibration","SOP available for all process","Cutting AQL reports available"];
CFG["Bonding"]=["Machine calibration reports available","2 hour condition report available","In line audit reports available","Supplier condition reports available","Certified operators only working","Mockup available","Good work place arrangement","Peel bond test reports available","Wash reports available"];
CFG["Production"]=["3/0 in-line process reports available","Critical operation check report","Mid line 100% check report","End line 100% check report","AQL Reports","CAPA for findings (In-line, Endline, AQL)","Complete Style file available","Line Sample / Color Sample / Packing approval available","All operation mockup available","Critical operation identification","All operation SPI mockup available","Certified checker / packer in module","Sewing machine condition","Standard guages functioning","Production WIP in agreed amount","Glouce use for light / white colors","Traffic light system functioning","Defect tag system functioning","SOP Available for all process","Label file functioning","Reconsilation functioning","Production monitoring system","SPC Report"];
CFG["IE"]=["Machine layouts","Machine wise RPM","Work place arrangement","5s"];
CFG["Machine"]=["Machine service record available","Oil control process","Threading way","Shuttle take-up spring, Tension post","Daily pressing machine check list"];
CFG["Safety"]=["Sharp tool log","Metal detector calibration record","2 Hourly 9 point MD Machine calibration","Hourly MD input report","Price ticket issue log","Needle procedure know by operator","Needle count match with system vs actual"];
CFG["Mold"]=["Form 25","Humidity check report","Moisture level check by Aqua boy","Fabric in process mold check report"];
CFG["Management"]=["KPI monitoring mechanism","Problem solving for deviation"];
CFG["Quality"]=["Pre-final report available","Final report available","Measurement report available"];
var STAGES=["Dashboard","LAB","RM","Cutting","Bonding","Production","IE","Machine","Safety","Mold","Management","Quality"];
var cur="Dashboard";var st={};var ph={};
var audits=[];try{audits=JSON.parse(localStorage.getItem("qa_audits")||"[]")}catch(e){audits=[]}
function save(){localStorage.setItem("qa_audits",JSON.stringify(audits))}
function go(s){cur=s;st={};ph={};render()}
function renderNav(){var h="";for(var i=0;i<STAGES.length;i++){h+='<button class="'+(STAGES[i]==cur?'on':'')+'" onclick="go(\''+STAGES[i]+'\')">'+STAGES[i]+'</button>'}document.getElementById("nav").innerHTML=h}
function setPt(i,val,btn){st[i]=val;var b=document.querySelectorAll('[data-p="'+i+'"]');for(var k=0;k<b.length;k++){b[k].className=""}btn.className=val==1?"a":val==0?"b":"c";calc()}
function calc(){var list=CFG[cur];var tot=0,max=0,na=0,fail=[];for(var i=0;i<list.length;i++){var v=st[i];if(v==="NA")na++;else if(v!==undefined){max++;tot+=v;if(v===0)fail.push(list[i])}}var pct=max?Math.round(tot/max*100):0;var el=document.getElementById("sc");if(el)el.innerHTML=cur+" SCORE: "+tot+" / "+max+" = "+pct+"% | N/A: "+na;var r=document.getElementById("rs");if(r)r.innerHTML=fail.length?"Missing: "+fail.join(", "):"All Available";return{tot:tot,max:max,pct:pct}}
function photo(i,el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){ph[i]=e.target.result;document.getElementById("ph"+i).innerHTML='<img class="t" src="'+e.target.result+'">'};r.readAsDataURL(f)}
function saveAudit(){var s=calc();var list=CFG[cur];var fails=[];for(var i=0;i<list.length;i++){if(st[i]===0)fails.push(list[i])}audits.push({stage:cur,date:document.getElementById("d1").value,style:document.getElementById("d2").value,score:s.tot+"/"+s.max+" = "+s.pct+"%",remark:document.getElementById("d5").value,fails:fails});save();alert(cur+" Saved! "+s.pct+"% | Findings: "+fails.length);go("Dashboard")}
function render(){renderNav();var a=document.getElementById("app");
if(cur=="Dashboard"){var tot=0,cnt=0,by={};for(var i=0;i<audits.length;i++){var p=parseInt((audits[i].score||"").split("=")[1])||0;tot+=p;cnt++;if(!by[audits[i].stage])by[audits[i].stage]={t:0,c:0,last:p};by[audits[i].stage].t+=p;by[audits[i].stage].c++;by[audits[i].stage].last=p}var avg=cnt?Math.round(tot/cnt):0;var rate=avg>=90?"EXCELLENT - GREEN":avg>=75?"GOOD - LIGHT GREEN":avg>=50?"AVERAGE - YELLOW":"POOR - RED";var col=avg>=90?"#16a34a":avg>=75?"#84cc16":avg>=50?"#eab308":"#dc2626";var h='<div class="card"><h2>Dashboard - Overall Rating</h2><button class="btn" onclick="printReport()">🖨️ PRINT / SAVE AS PDF - WHOLE AUDIT REPORT</button><div style="background:'+col+';color:#fff;padding:16px;border-radius:10px;text-align:center"><div style="font-size:36px;font-weight:900">'+avg+'%</div><div style="font-weight:800">'+rate+'</div><div>Total Audits: '+audits.length+'</div></div></div><div class="card"><h3>Department Wise Average</h3>';for(var k in by){var a2=Math.round(by[k].t/by[k].c);var c2=a2>=90?"#16a34a":a2>=75?"#84cc16":a2>=50?"#eab308":"#dc2626";h+='<div style="margin:8px 0"><b>'+k+'</b> - '+a2+'% ('+by[k].c+' audits) - Last: '+by[k].last+'%<div style="background:#e2e8f0;border-radius:10px;height:12px;overflow:hidden"><div style="width:'+a2+'%;background:'+c2+';height:12px"></div></div></div>'}h+='</div><div class="card"><h3>Overall Trend - Last Audits (Old to New)</h3>';for(var i=0;i<audits.length;i++){var p2=parseInt((audits[i].score||"").split("=")[1])||0;var c3=p2>=75?"#16a34a":p2>=50?"#eab308":"#dc2626";h+='<div style="margin:6px 0"><b>'+audits[i].stage+'</b> - '+(audits[i].date||"")+' - '+p2+'%<div style="background:#e2e8f0;border-radius:10px;height:10px;overflow:hidden"><div style="width:'+p2+'%;background:'+c3+';height:10px"></div></div></div>'}h+='</div><div class="card"><h3>All Audits List</h3>';for(var i=0;i<audits.length;i++){h+='</div><div class="card"><h3>Audit Report - Findings (0 Point Items)</h3>';for(var i=0;i<audits.length;i++){var f=audits[i].fails||[];h+='<div style="border-bottom:1px solid #eee;padding:10px 0"><b>'+audits[i].stage+'</b> - '+(audits[i].date||"")+' - '+(audits[i].style||"")+' - '+(audits[i].score||"")+'<br><span style="color:#dc2626;font-weight:700">Findings ('+f.length+'): '+(f.length?f.join(" | "):"No Findings - All OK")+'</span><br><small>Remark: '+(audits[i].remark||"-")+'</small></div>'}h+='</div>'}h+='</div>';a.innerHTML=h;return}
var list=CFG[cur];var h='<div class="card"><h2>'+cur+' - Availability Audit</h2><p style="font-size:13px">Available = 1 Point | Not Available = 0 Point | N/A = Not Counted</p><label>Date</label><input id="d1" type="date"><label>Style No</label><input id="d2" placeholder="Style"><label>Line / Department / PO</label><input id="d3" placeholder="Line / PO"><label>Auditor</label><input id="d4" placeholder="Auditor Name"><div class="score" id="sc">'+cur+' SCORE: 0 / 0 = 0%</div><div id="rs" style="text-align:center;margin-top:6px"></div></div>';
for(var i=0;i<list.length;i++){h+='<div class="card item"><b>'+(i+1)+'. '+list[i]+'</b><div class="pts"><button data-p="'+i+'" onclick="setPt('+i+',1,this)">Available<br>1 Point</button><button data-p="'+i+'" onclick="setPt('+i+',0,this)">Not Available<br>0 Point</button><button data-p="'+i+'" onclick="setPt('+i+',\'NA\',this)">N/A</button></div><label>Photo</label><input type="file" accept="image/*" onchange="photo('+i+',this)"><div id="ph'+i+'"></div></div>'}
h+='<div class="card"><label>Remarks / CAPA</label><textarea id="d5" rows="3"></textarea><button class="btn" onclick="saveAudit()">SAVE '+cur+' AUDIT</button></div>';a.innerHTML=h;}
function printReport(){var tot=0,cnt=0;for(var i=0;i<audits.length;i++){tot+=parseInt((audits[i].score||"").split("=")[1])||0;cnt++}var avg=cnt?Math.round(tot/cnt):0;var h='<html><head><title>QA Audit Report</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #000;padding:6px;font-size:12px;text-align:left}h1{text-align:center}h2{margin-top:20px}</style></head><body><h1>QA AUDIT REPORT - WHOLE AUDIT UPDATE</h1><p><b>Date:</b> '+new Date().toLocaleDateString()+' | <b>Total Audits:</b> '+audits.length+' | <b>Overall Rating:</b> '+avg+'%</p><h2>Summary</h2><table><tr><th>Department</th><th>Date</th><th>Style</th><th>Score</th><th>Findings</th><th>Remark</th></tr>';for(var i=0;i<audits.length;i++){var f=audits[i].fails||[];h+='<tr><td>'+audits[i].stage+'</td><td>'+(audits[i].date||"")+'</td><td>'+(audits[i].style||"")+'</td><td>'+(audits[i].score||"")+'</td><td style="color:red">'+(f.length?f.join(", "):"No Findings")+'</td><td>'+(audits[i].remark||"")+'</td></tr>'}h+='</table><h2>Findings Detail - For CAPA</h2>';for(var i=0;i<audits.length;i++){var f2=audits[i].fails||[];if(f2.length){h+='<p><b>'+audits[i].stage+' - '+audits[i].style+' - '+(audits[i].date||"")+'</b><br>'+f2.join("<br>")+'</p>'}}h+='<br><br><p>Prepared By: ____________________ &nbsp;&nbsp; Checked By: ____________________ &nbsp;&nbsp; Approved By: ____________________</p></body></html>';var w=window.open('','_blank');w.document.write(h);w.document.close();w.print()}render();
</script></body></html>
