<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA AUDIT TOOL</title>
<style>
body{font-family:Arial;margin:0;background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:14px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}
nav button{padding:9px 12px;border-radius:20px;border:1px solid #ccc;background:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:#0f172a;color:#fff}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
label{font-weight:700;font-size:13px;display:block;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.item{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:10px}
.pts{display:flex;gap:6px;margin-top:8px}
.pts button{flex:1;padding:10px;border:1px solid #ccc;background:#f8fafc;border-radius:8px;font-weight:800;cursor:pointer}
.pts button.a{background:#16a34a;color:#fff}
.pts button.b{background:#dc2626;color:#fff}
.pts button.c{background:#64748b;color:#fff}
.score{background:#eff6ff;padding:12px;border-radius:10px;font-weight:800;text-align:center}
.btn{background:#0f172a;color:#fff;border:0;padding:13px;border-radius:10px;width:100%;font-weight:800;cursor:pointer;margin-top:10px}
img.t{width:70px;height:70px;object-fit:cover;border-radius:8px;margin-top:5px}
</style></head><body>
<header><h1>QA AUDIT TOOL - RM to FG</h1><div style="font-size:12px;opacity:.8">LAB - RM - Cutting - Inline - Endline - Finishing - Final AQL</div></header>
<nav id="nav"></nav><div class="wrap" id="app"></div>
<script>
var LAB=["Fabric Inspection Report","Fabric GSM Report","Shrinkage Report (Residual / Steam)","Shade Band","Approved Fabric Hanger","Mill Inspection Report","Fabric Test Reports","Trims Inspection Reports","Trims Check Under Metal Detection","Fabric Relaxing Reports"];
var STAGES=["Dashboard","LAB","RM - Fabric","Cutting","Hourly Inline","Endline","Finishing","Final AQL"];
var cur="Dashboard";var labState={};var labPhotos={};
var audits=[];try{audits=JSON.parse(localStorage.getItem("qa_audits")||"[]")}catch(e){audits=[]}
function save(){localStorage.setItem("qa_audits",JSON.stringify(audits))}
function go(s){cur=s;render()}
function renderNav(){var h="";for(var i=0;i<STAGES.length;i++){h+='<button class="'+(STAGES[i]==cur?'on':'')+'" onclick="go(\''+STAGES[i]+'\')">'+STAGES[i]+'</button>'}document.getElementById("nav").innerHTML=h}
function setLab(i,val,btn){labState[i]=val;var b=document.querySelectorAll('[data-lab="'+i+'"]');for(var k=0;k<b.length;k++){b[k].className=""}btn.className=val==1?"a":val==0?"b":"c";calcLab()}
function calcLab(){var tot=0,max=0,na=0,fail=[];for(var i=0;i<LAB.length;i++){var v=labState[i];if(v==="NA")na++;else if(v!==undefined){max++;tot+=v;if(v===0)fail.push(LAB[i])}}var pct=max?Math.round(tot/max*100):0;var el=document.getElementById("labScore");if(el)el.innerHTML="LAB SCORE: "+tot+" / "+max+" = "+pct+"% | N/A: "+na+" | Missing: "+fail.length;var r=document.getElementById("labResult");if(r)r.innerHTML=fail.length?"Missing: "+fail.join(", "):"All Available";return{tot:tot,max:max,pct:pct}}
function photoLab(i,el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){labPhotos[i]=e.target.result;document.getElementById("ph"+i).innerHTML='<img class="t" src="'+e.target.result+'">'};r.readAsDataURL(f)}
function saveLab(){var s=calcLab();audits.push({stage:"LAB",date:document.getElementById("d1").value,style:document.getElementById("d2").value,score:s.tot+"/"+s.max+" = "+s.pct+"%",remark:document.getElementById("d5").value});save();alert("LAB Saved! "+s.pct+"%");go("Dashboard")}
function saveGen(){var q=document.getElementById("g3").value||0;var d=document.getElementById("g4").value||0;audits.push({stage:cur,date:document.getElementById("g1").value,style:document.getElementById("g2").value,score:"Checked "+q+" Defects "+d,remark:document.getElementById("g5").value});save();alert(cur+" Saved!");go("Dashboard")}
function render(){renderNav();var a=document.getElementById("app");
if(cur=="Dashboard"){var h='<div class="card"><h2>Dashboard</h2><p>Total Audits: <b>'+audits.length+'</b></p>';for(var i=0;i<audits.length;i++){h+='<div style="border-bottom:1px solid #eee;padding:8px 0"><b>'+audits[i].stage+'</b> - '+(audits[i].date||"")+' - '+(audits[i].style||"")+' - '+(audits[i].score||"")+'<br><small>'+(audits[i].remark||"")+'</small></div>'}h+='</div>';a.innerHTML=h;return}
if(cur=="LAB"){var h='<div class="card"><h2>LAB - Availability Audit</h2><p style="font-size:13px">Available = 1 Point | Not Available = 0 Point | N/A = Not Counted</p><label>Date</label><input id="d1" type="date"><label>Style No</label><input id="d2" placeholder="Style"><label>PO No</label><input id="d3" placeholder="PO"><label>Supplier / Mill</label><input id="d4" placeholder="Mill"><div class="score" id="labScore">LAB SCORE: 0 / 0 = 0%</div><div id="labResult" style="text-align:center;margin-top:6px"></div></div>';for(var i=0;i<LAB.length;i++){h+='<div class="card item"><b>'+(i+1)+'. '+LAB[i]+'</b><div class="pts"><button data-lab="'+i+'" onclick="setLab('+i+',1,this)">Available<br>1 Point</button><button data-lab="'+i+'" onclick="setLab('+i+',0,this)">Not Available<br>0 Point</button><button data-lab="'+i+'" onclick="setLab('+i+',\'NA\',this)">N/A</button></div><label>Photo - '+LAB[i]+'</label><input type="file" accept="image/*" onchange="photoLab('+i+',this)"><div id="ph'+i+'"></div></div>'}h+='<div class="card"><label>Remarks</label><textarea id="d5" rows="3"></textarea><button class="btn" onclick="saveLab()">SAVE LAB AUDIT</button></div>';a.innerHTML=h;return}
a.innerHTML='<div class="card"><h2>'+cur+'</h2><label>Date</label><input id="g1" type="date"><label>Style</label><input id="g2"><label>Checked Qty</label><input id="g3" type="number"><label>Defects Found</label><input id="g4" type="number"><label>Remarks</label><textarea id="g5" rows="3"></textarea><button class="btn" onclick="saveGen()">SAVE '+cur+' AUDIT</button></div>';}
render();
</script></body></html>
