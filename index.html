<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA AUDIT TOOL - RM to FG</title>
<style>
{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#111}
header{background:#0f172a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:19px}header p{margin:4px 0 0;opacity:.8;font-size:12px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:58px;z-index:9}
nav button{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;padding:9px 12px;border-radius:20px;cursor:pointer;font-weight:700}
nav button.active{background:#0f172a;color:#fff}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{margin:0 0 8px;font-size:18px}h3{margin:12px 0 8px}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:10px}
.item b{font-size:14px}.item small{color:#64748b}
.pts{display:flex;gap:6px;margin-top:8px}
.pts button{flex:1;padding:10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;font-weight:800;cursor:pointer}
.pts button.sel1{background:#16a34a;color:#fff;border-color:#16a34a}
.pts button.sel0{background:#dc2626;color:#fff;border-color:#dc2626}
.pts button.selNA{background:#64748b;color:#fff;border-color:#64748b}
.score{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:10px;font-weight:800;text-align:center;font-size:18px}
.btn{background:#0f172a;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.btn2{background:#16a34a;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e8f0;padding:7px;text-align:left}
img.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800;color:#fff}.pass{background:#16a34a}.fail{background:#dc2626}
</style>
</head>
<body>
<header><h1>QA AUDIT TOOL - RM to FG</h1><p>LAB • RM • Cutting • Inline • Endline • Finishing • Final AQL | dilanccc.github.io/qa-audit-tool</p></header>
<nav id="nav"></nav>
<div class="wrap" id="app"></div>
<script>
const LAB=[
"Fabric Inspection Report",
"Fabric GSM Report",
"Shrinkage Report (Residual / Steam)",
"Shade Band",
"Approved Fabric Hanger",
"Mill Inspection Report",
"Fabric Test Reports",
"Trims Inspection Reports",
"Trims Check Under Metal Detection",
"Fabric Relaxing Reports"
];
const STAGES=["Dashboard","LAB","RM - Fabric","Cutting","Hourly Inline","Endline","Finishing","Final AQL"];
let cur="Dashboard", labState={}, labPhotos={};
let audits=JSON.parse(localStorage.getItem("qa_audits")||"[]");
function save(){localStorage.setItem("qa_audits",JSON.stringify(audits))}
function nav(){document.getElementById("nav").innerHTML=STAGES.map(s=>`<button class="${s==cur?'active':''}" onclick="go('${s}')">${s}</button>`).join("")}
function go(s){cur=s;nav();render()}
function setLab(i,val,btn){labState[i]=val;document.querySelectorAll(`[data-lab="${i}"]`).forEach(b=>b.classList.remove("sel1","sel0","selNA"));btn.classList.add(val==1?"sel1":val==0?"sel0":"selNA");calcLab()}
function calcLab(){
let tot=0,max=0,na=0,fail=[];
LAB.forEach((n,i)=>{let v=labState[i];if(v==="NA")na++;else if(v!==undefined){max++;tot+=v;if(v===0)fail.push(n)}});
let pct=max?Math.round(tot/max100):0;
document.getElementById("labScore").innerHTML=`LAB SCORE: ${tot} / ${max} &nbsp; = ${pct}% &nbsp; | &nbsp; N/A: ${na} &nbsp; | &nbsp; Missing: ${fail.length}`;
document.getElementById("labResult").innerHTML=fail.length?`<span style="color:#dc2626">⚠ ${fail.length} NOT AVAILABLE: ${fail.join(", ")}</span>`:`<span style="color:#16a34a">✅ ALL AVAILABLE</span>`;
return {tot,max,pct}
}
function photoLab(i,el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{labPhotos[i]=e.target.result;document.getElementById("ph"+i).innerHTML=`<img class="thumb" src="${e.target.result}">`};r.readAsDataURL(f)}
function saveLab(){
let s=calcLab();
let rec={stage:"LAB",date:document.getElementById("d1").value,style:document.getElementById("d2").value,po:document.getElementById("d3").value,supplier:document.getElementById("d4").value,score:s.tot+"/"+s.max+" = "+s.pct+"%",details:LAB.map((n,i)=>n+": "+(labState[i]==1?"Available (1)":labState[i]==0?"Not Available (0)":"N/A")).join(" | "),remark:document.getElementById("d5").value,photos:Object.values(labPhotos)};
audits.push(rec);save();alert("LAB Audit Saved! Score "+s.pct+"%");go("Dashboard");
}
function render(){
let a=document.getElementById("app");
if(cur=="Dashboard"){
let by={};STAGES.forEach(s=>by[s]={n:0,p:0});
audits.forEach(x=>{if(by[x.stage])by[x.stage].n++});
a.innerHTML=`<div class="card"><h2>📊 Dashboard - Today</h2><p>Total Audits: <b>${audits.length}</b></p><table><tr><th>Stage</th><th>Audits</th><th>Last Score</th></tr>${STAGES.slice(1).map(s=>{let l=[...audits].reverse().find(x=>x.stage==s);return `<tr><td>${s}</td><td>${by[s].n}</td><td>${l?l.score:"-"}</td></tr>`}).join("")}</table></div>
<div class="card"><h2>Recent Audits</h2>${audits.slice(-10).reverse().map(x=>`<div style="border-bottom:1px solid #eee;padding:8px 0"><b>${x.stage}</b> - ${x.date||""} - ${x.style||""} - ${x.score||""}<br><small>${x.details||""}</small><br><small>${x.remark||""}</small></div>`).join("")||"No audits yet. Go to LAB and do first audit."}</div>
<div class="card"><button class="btn2" onclick="if(confirm('Clear all?')){audits=[];save();render()}">Clear All Data</button></div>`;
return;
}
if(cur=="LAB"){
a.innerHTML=`<div class="card"><h2>🧪 LAB - Availability Audit</h2><p style="font-size:13px;color:#475569">Rule: <b>Available = 1 Point</b> | <b>Not Available = 0 Point</b> | <b>N/A = Not Counted</b>. Photo for each item.</p>
<div class="row"><div><label>Date</label><input id="d1" type="date"></div><div><label>Style No</label><input id="d2" placeholder="Style"></div></div>
<div class="row"><div><label>PO No</label><input id="d3" placeholder="PO"></div><div><label>Supplier / Mill</label><input id="d4" placeholder="Mill / Supplier"></div></div>
<div class="score" id="labScore">LAB SCORE: 0 / 0 = 0%</div><div id="labResult" style="text-align:center;margin-top:6px"></div>
</div>
${LAB.map((n,i)=>`<div class="card item"><b>${i+1}. ${n}</b><div class="pts">
<button data-lab="${i}" onclick="setLab(${i},1,this)">✅ Available<br>1 Point</button>
<button data-lab="${i}" onclick="setLab(${i},0,this)">❌ Not Available<br>0 Point</button>
<button data-lab="${i}" onclick="setLab(${i},'NA',this)">➖ N/A</button></div>
<label>Photo - ${n}</label><input type="file" accept="image/" capture="environment" onchange="photoLab(${i},this)"><div id="ph${i}"></div>
</div>`).join("")}
<div class="card"><label>Remarks / Missing Documents</label><textarea id="d5" rows="3" placeholder="e.g. GSM report pending from mill..."></textarea><button class="btn" onclick="saveLab()">💾 SAVE LAB AUDIT</button></div>`;
return;
}
// Other stages - simple generic form
a.innerHTML=`<div class="card"><h2>${cur}</h2><p style="font-size:13px;color:#475569">This stage uses same system. LAB scoring is updated. For ${cur}, use Pass / Fail below.</p>
<div class="row"><div><label>Date</label><input id="g1" type="date"></div><div><label>Style</label><input id="g2"></div></div>
<label>Checked Qty</label><input id="g3" type="number" placeholder="e.g. 100">
<label>Defects Found</label><input id="g4" type="number" placeholder="e.g. 3">
<label>Remarks</label><textarea id="g5" rows="3"></textarea>
<button class="btn" onclick="saveGen()">💾 SAVE ${cur} AUDIT</button></div>`;
}
function saveGen(){
let q=+document.getElementById("g3").value||0,d=+document.getElementById("g4").value||0;
audits.push({stage:cur,date:document.getElementById("g1").value,style:document.getElementById("g2").value,score:q?Math.round((1-d/q)100)+"% PASS":"-",details:"Checked: "+q+" | Defects: "+d,remark:document.getElementById("g5").value});
save();alert(cur+" Saved!");go("Dashboard");
}
nav();render();
</script>
</body>
</html>
